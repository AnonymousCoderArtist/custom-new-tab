<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="icon" href="https://www.google.com/s2/favicons?domain=worldmonitor.app&sz=64" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg" id="bg"></div>

  <iframe id="dash" class="dash" title="World Monitor"></iframe>

  <div id="dashFallback" class="dash-fallback">
    <div class="dash-fallback-card">
      <h2>World Monitor</h2>
      <p>Live dashboard could not be embedded here. Open it directly with your exact view.</p>
      <a id="dashFallbackLink" href="#" target="_blank" rel="noopener">Open dashboard</a>
    </div>
  </div>

  <div class="ui" id="ui">
    <header class="top">
      <div class="time-block">
        <div class="clock" id="clock">00:00</div>
        <div class="date" id="date"></div>
        <div class="greet" id="greet">Hello</div>
      </div>

      <div class="top-actions">
        <button class="chip active" id="modeDash" type="button">Dashboard</button>
        <button class="chip" id="modeHome" type="button">Home</button>
        <button class="icon-btn" id="fullscreenBtn" type="button" title="Fullscreen dashboard">⛶</button>
        <button class="icon-btn" id="settingsBtn" type="button" title="Settings">⚙</button>
      </div>
    </header>

    <form class="search" id="searchForm">
      <input id="searchInput" type="text" placeholder="Search the web..." autocomplete="off" />
      <button type="submit">Search</button>
    </form>

    <div class="section-head">
      <h2>Shortcuts</h2>
      <button class="ghost" id="addBtn" type="button">+ Add</button>
    </div>

    <div class="grid" id="grid"></div>

    <footer class="foot">
      <span id="footNote">press / to search</span>
      <button class="ghost" id="hideUiBtn" type="button">Hide UI</button>
    </footer>
  </div>

  <button class="show-ui" id="showUiBtn" type="button">Show UI</button>

  <div class="modal-back" id="settingsModal">
    <div class="modal">
      <div class="modal-head">
        <h3>Settings</h3>
        <button class="icon-btn" data-close type="button">×</button>
      </div>

      <label class="field">
        <span>Accent color</span>
        <input type="color" id="accentInput" value="#7c5cff" />
      </label>

      <label class="field">
        <span>Background image url</span>
        <input type="text" id="bgInput" placeholder="https://..." />
      </label>

      <div class="field">
        <span>Wallpapers</span>
        <div class="wallpapers" id="wallpapers"></div>
      </div>

      <label class="field">
        <span>Dashboard url</span>
        <input type="text" id="dashUrlInput" />
      </label>

      <label class="field">
        <span>Search engine</span>
        <select id="engineInput">
          <option value="https://www.google.com/search?q=">Google</option>
          <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
          <option value="https://www.bing.com/search?q=">Bing</option>
          <option value="https://www.youtube.com/results?search_query=">YouTube</option>
          <option value="https://chatgpt.com/?q=">ChatGPT</option>
        </select>
      </label>

      <label class="check">
        <input type="checkbox" id="showDashInput" checked />
        <span>Show dashboard on new tab</span>
      </label>

      <div class="modal-actions">
        <button class="ghost" id="resetBtn" type="button">Reset all</button>
        <button class="primary" data-close type="button">Done</button>
      </div>
    </div>
  </div>

  <div class="modal-back" id="addModal">
    <div class="modal">
      <div class="modal-head">
        <h3>Add shortcut</h3>
        <button class="icon-btn" data-close type="button">×</button>
      </div>

      <label class="field">
        <span>Name</span>
        <input type="text" id="nameInput" placeholder="ChatGPT" />
      </label>

      <label class="field">
        <span>Url</span>
        <input type="text" id="urlInput" placeholder="https://chatgpt.com" />
      </label>

      <label class="field">
        <span>Icon url (optional)</span>
        <input type="text" id="iconInput" placeholder="leave empty for favicon" />
      </label>

      <div class="modal-actions">
        <button class="primary" id="saveShortcut" type="button">Save</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
